<div class="app-window" id="FlashcardsApp">
  <div class="app-header">
    <span class="app-title">🗂️ Flashcards</span>
    <div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div>
  </div>
  <div class="app-content">
    <div class="fc">
      <div id="fc-card" class="fc-card"><div id="fc-text" class="fc-text">Add a card to begin</div><div class="fc-face" id="fc-face"></div></div>
      <div class="fc-nav"><button id="fc-prev">‹ Prev</button><span id="fc-pos">0 / 0</span><button id="fc-next">Next ›</button></div>
      <form id="fc-add" class="fc-add"><input id="fc-q" placeholder="Front…" autocomplete="off"><input id="fc-a" placeholder="Back…" autocomplete="off"><button>+ Add</button></form>
      <button id="fc-del" class="fc-del">Delete this card</button>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
